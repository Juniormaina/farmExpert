# Pilot host: one Render web service with a persistent disk.
# The free plan has no disk, so it is not the pilot path. A disk keeps SQLite
# across deploys and restarts. It does not replace an off-site backup.
# A git push does not attach this disk to a service that was created without it.
# Add the disk in the dashboard, mounted at /var/data, or apply this blueprint.
# https://render.com/docs/disks
#
# Before the first pilot deploy, set VITE_SUPPORT_CONTACT in the dashboard.
# Leave HOSTED_AI_API_KEY, SMS_WEBHOOK_TOKEN, and USSD_WEBHOOK_TOKEN empty.
# The build check fails if those rules are broken.

services:
  - type: web
    name: farmexpert
    runtime: node
    plan: starter
    region: oregon
    buildCommand: node scripts/check-pilot-env.mjs && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: farmexpert-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "1"
      - key: CLIENT_DIST_PATH
        value: ./client/dist
      - key: FARMEXPERT_DB_PATH
        value: /var/data/farmexpert.db
      - key: PILOT_REQUIRE_SUPPORT
        value: "1"
      - key: VITE_SUPPORT_CONTACT
        sync: false
      - key: AI_REPLY_BUDGET_MS
        value: "10000"
      - key: API_STYLE
        value: openai
      # Pilot leaves this empty. The build check rejects a key.
      - key: HOSTED_AI_API_KEY
        sync: false
      - key: HOSTED_AI_BASE_URL
        sync: false
      - key: HOSTED_AI_MODEL
        sync: false
      # Optional. Set only if an operator must rebuild demo prices. Not for farmers.
      - key: DEMO_RESET_TOKEN
        sync: false
